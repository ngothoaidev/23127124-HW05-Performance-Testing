<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .box { fill:#eff6ff; stroke:#2563eb; stroke-width:2; rx:14; }
      .decision { fill:#fff7ed; stroke:#ea580c; stroke-width:2; }
      .pass { fill:#ecfdf5; stroke:#059669; stroke-width:2; rx:14; }
      .fail { fill:#fef2f2; stroke:#dc2626; stroke-width:2; rx:14; }
      .line { stroke:#334155; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      text { font-family:Segoe UI,Arial,sans-serif; fill:#0f172a; font-size:19px; text-anchor:middle; }
      .small { font-size:16px; fill:#475569; }
      .title { font-size:30px; font-weight:700; }
    </style>
  </defs>
  <text x="600" y="42" class="title">Continuous Performance Testing Decision Flow</text>
  <rect class="box" x="55" y="92" width="190" height="72"/><text x="150" y="135">Commit / PR</text>
  <path class="line" d="M245 128 H315"/>
  <rect class="box" x="315" y="92" width="220" height="72"/><text x="425" y="120">Classify changed</text><text x="425" y="145">files</text>
  <path class="line" d="M535 128 H610"/>
  <polygon class="decision" points="720,75 830,128 720,181 610,128"/><text x="720" y="120">Performance</text><text x="720" y="145">sensitive?</text>
  <path class="line" d="M720 181 V245"/><text x="748" y="220" class="small">Yes</text>
  <rect class="box" x="610" y="245" width="220" height="72"/><text x="720" y="275">Deploy, seed,</text><text x="720" y="300">and warm up</text>
  <path class="line" d="M720 317 V375"/>
  <rect class="box" x="610" y="375" width="220" height="72"/><text x="720" y="405">Run JMeter</text><text x="720" y="430">performance gate</text>
  <path class="line" d="M720 447 V500"/>
  <polygon class="decision" points="720,500 850,560 720,620 590,560"/><text x="720" y="552">p95 +20%/50ms</text><text x="720" y="578">or errors &gt;1%?</text>
  <path class="line" d="M850 560 H960"/><text x="900" y="545" class="small">Yes</text>
  <rect class="fail" x="960" y="515" width="200" height="90"/><text x="1060" y="548">Fail check</text><text x="1060" y="575">Attach JTL/HTML</text>
  <path class="line" d="M590 560 H460"/><text x="530" y="545" class="small">No</text>
  <rect class="pass" x="245" y="515" width="215" height="90"/><text x="352" y="548">Pass check</text><text x="352" y="575">Store baseline</text>
  <path class="line" d="M610 128 H500 V650 H245"/><text x="545" y="112" class="small">No</text>
  <rect class="pass" x="55" y="615" width="190" height="62"/><text x="150" y="653">Smoke tests only</text>
  <text x="600" y="680" class="small">Nightly: Load  •  Weekly: Stress  •  Pre-release: Soak</text>
</svg>

